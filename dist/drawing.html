<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Particle | Drawing preview</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="polish.css"></head><body><header class="header"><span class="brand"><b>LUTRON</b><span class="bar"></span><span>Particle</span></span><span class="meta">Resource preview</span></header><main class="page"><section class="panel completion"><span class="tag">RESOURCE</span><h1 id="title" style="margin-top:24px"></h1><p>This window demonstrates where the selected resource will open.</p><div class="info-box"><h3>Asset link pending</h3><p>The official drawing or document will appear here once its URL is supplied.</p></div><p class="meta">No technical drawing has been substituted or generated.</p><button onclick="window.close()">Close preview</button></section></main><div class="page-utilities"><button class="go-back-button" id="resource-go-back">Go Back</button><div id="resource-reference" class="page-reference"></div></div><script src="icons.js"></script><script src="references.js"></script><script>document.getElementById('resource-go-back').onclick=()=>{if(history.length>1)history.back();else{window.close();setTimeout(()=>location.href='index.html',100)}};const p=new URLSearchParams(location.search);document.getElementById('title').textContent=[p.get('mount')?p.get('mount')+' mount':'',p.get('variant')||'Drawing'].filter(Boolean).join(' · ');document.getElementById('resource-reference').innerHTML=referenceContent('R-RESOURCE-'+(p.get('variant')||'DRAWING').toUpperCase().replace(/[^A-Z0-9]+/g,'-'));</script></body></html>
